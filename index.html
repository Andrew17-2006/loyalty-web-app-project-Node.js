<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cashback Invest - Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"> 
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> 
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Poppins:wght@400;500;700&display=swap" rel="stylesheet"> 
  <link rel="icon" type="image/x-icon" href="src/images/web-site_icon.png" />
  
  <!-- Підключи всі CSS -->
  <link rel="stylesheet" href="src/styles/style.css">
  <link rel="stylesheet" href="src/styles/blocks/grid.css">
  <link rel="stylesheet" href="src/styles/utilities/mixin.css">
  <link rel="stylesheet" href="src/styles/register.css">

  <script src="src/scripts/main.js" defer></script>
</head>
<body>
  <div class="register-container">
    <div class="form-section">
      <h2>Hello, friend!</h2>
      <form>
        <input type="text" placeholder="Name" required>
        <input type="email" placeholder="E-mail" required>
        <input type="password" placeholder="Password" required>
        <button type="submit">Create Account</button>
      </form>
      <p>Already have an account? <a href="#">Sign in</a></p>
    </div>

    <div class="info-section">
      <h2>Glad to see You!</h2>
      <p>Earn money by investing cashback from purchases!</p>
    </div>
  </div>
</body>
