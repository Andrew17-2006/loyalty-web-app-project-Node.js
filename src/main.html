<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cashback Invest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Poppins:wght@400;500;700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <!-- Завантаження хедера -->
    <script src="./scripts/header.js"></script>
    
    <link rel="icon" type="image/x-icon" href="./images/web-site_icon.png"/>

</head>
<body>
  <!-- Хедер завантажиться тут автоматично -->

  <main class="main-content">
    <div class="grid-container">
      <div class="grid-item grid-full" id="profileBanner">
        <img src="./images/home-grid__banner.png" alt="1-st grid-element Banner" class="home-grid__banner"/>
      </div>

      <div class="grid-item grid-half" id="currencyChart">
        <img src="./images/save-front-side.jpg" alt="-"/>
      </div>

      <div class="grid-item grid-half" id="activityChart">
        <img src="./images/save-front-side.jpg" alt="-"/>
      </div>

      <div class="grid-item grid-half" id="cardsWidget">
        <img src="./images/save-front-side.jpg" alt="-"/>
      </div>

      <div class="grid-item grid-half" id="storesMap">
        <img src="./images/save-front-side.jpg" alt="-"/>
      </div>
    </div>
  </main>
  
  <footer class="footer"></footer>
