<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cashback Invest - Investments</title>
  <script src="./scripts/header.js"></script>
  <script src="./scripts/investments.js" defer></script>
  <link rel="icon" type="image/x-icon" href="./images/web-site_icon.png" />
  <link rel="stylesheet" href="./styles/style.css"/>
</head>

<body>
  <main class="investments-content">
    <section class="investment-summary">
      <h2>Investment Dashboard</h2>
      <div class="summary-cards">
        <div class="summary-item">
          <h3>Available Cashback</h3>
          <p id="cashback-balance">₴0</p>
        </div>
        <div class="summary-item">
          <h3>Total Invested</h3>
          <p id="invested-total">₴0</p>
        </div>
        <div class="summary-item">
          <h3>Profit</h3>
          <p id="invested-profit">₴0</p>
        </div>
      </div>
    </section>

    <section class="market-container">
      <h2>Currency Market</h2>
      <div id="market-list" class="market-list"></div>
    </section>

    <section class="portfolio-container">
      <h2>Your Portfolio</h2>
      <table class="portfolio-table">
        <thead>
          <tr>
            <th>Asset</th>
            <th>Invested (₴)</th>
            <th>Current Value (₴)</th>
            <th>Profit</th>
          </tr>
        </thead>
        <tbody id="portfolio-body"></tbody>
      </table>
    </section>
  </main>
</body>
</html>
