<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cashback Invest - Investments</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet" />

  <!-- CSS -->
  <link rel="stylesheet" href="./styles/style.css" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Header + JS -->
  <script src="./scripts/header.js" defer></script>
  <script src="./scripts/investments.js" defer></script>

  <link rel="icon" type="image/x-icon" href="./images/web-site_icon.png" />
</head>
<body>
  <main class="investments-main">
    <!-- 📊 Блок графіка -->
    <section class="chart-section">
      <div class="chart-header">
        <h2>Currency Trend</h2>

        <!-- Кнопки вибору активу для графіка -->
        <div class="asset-buttons" role="group" aria-label="Choose asset">
          <button class="asset-btn active" data-asset="USD">USD / UAH</button>
          <button class="asset-btn" data-asset="EUR">EUR / UAH</button>
          <button class="asset-btn" data-asset="GBP">GBP / UAH</button>
        </div>
      </div>

      <!-- Кнопки діапазону -->
      <div class="chart-controls">
        <button class="range-btn active" data-range="7">7 days</button>
        <button class="range-btn" data-range="30">30 days</button>
        <button class="range-btn" data-range="90">3 months</button>
      </div>

      <div class="chart-wrapper">
        <canvas id="investmentChart"></canvas>
      </div>
    </section>

    <!-- 💰 Інвестиції + Портфоліо -->
    <section class="investment-container">
      <div class="investment-controls">
        <h2>Manage Investments</h2>
        <!-- Селектор активу для інвестицій -->
        <label class="sr-only" for="assetSelect">Asset</label>
        <select id="assetSelect">
          <option value="USD" selected>USD / UAH</option>
          <option value="EUR">EUR / UAH</option>
          <option value="GBP">GBP / UAH</option>
        </select>

        <input type="number" id="investAmount" placeholder="Enter cashback amount ₴" min="1" />
        <button id="investBtn">Invest Now</button>
        <p id="balanceInfo">Your cashback balance: ₴1250</p>
      </div>

      <div class="portfolio">
        <h2>Current Portfolio</h2>
        <table>
          <thead>
            <tr>
              <th>Asset</th>
              <th>Invested (₴)</th>
              <th>Rate</th>
              <th>Profit/Loss (₴)</th>
            </tr>
          </thead>
          <tbody id="portfolioTable"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
