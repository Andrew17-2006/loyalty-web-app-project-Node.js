<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cashback Invest - Investments</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="./styles/style.css" />

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="./scripts/header.js" defer></script>
  <script src="./scripts/investments.js" defer></script>

  <link rel="icon" type="image/x-icon" href="./images/web-site_icon.png" />
</head>
<body>
  <main class="main-content investments-page">

    <!-- 🟦 Головний контейнер -->
    <div class="investments-container">
      <section class="investments-header">
        <h1>💹 Investments Dashboard</h1>
        <p>Invest your cashback into currency or crypto assets and track growth in real time</p>
      </section>
    </div>

    <!-- 🟨 Контейнер графіка -->
    <div class="investments-container chart-container">
      <section class="chart-section">
        <h2>Currency Trend</h2>
        <div class="chart-controls">
          <button class="range-btn active" data-range="7">7 days</button>
          <button class="range-btn" data-range="30">30 days</button>
          <button class="range-btn" data-range="365">1 year</button>
        </div>
        <canvas id="investmentChart" width="900" height="400"></canvas>
      </section>
    </div>

    <!-- 🟩 Контейнер інвестування -->
    <div class="investments-container controls-container">
      <section class="investment-controls">
        <h2>Available Assets</h2>
        <select id="assetSelect">
          <option value="USD">USD / UAH</option>
          <option value="EUR">EUR / UAH</option>
          <option value="BTC">BTC / USD</option>
        </select>
        <input type="number" id="investAmount" placeholder="Enter cashback amount ₴" min="1" />
        <button id="investBtn">Invest Now</button>
        <p id="balanceInfo">Your cashback balance: ₴0</p>
      </section>
    </div>

    <!-- 🟧 Контейнер портфеля -->
    <div class="investments-container portfolio-container">
      <section class="portfolio">
        <h2>Your Portfolio</h2>
        <table>
          <thead>
            <tr>
              <th>Asset</th>
              <th>Invested (₴)</th>
              <th>Rate</th>
              <th>Change %</th>
              <th>Profit/Loss (₴)</th>
            </tr>
          </thead>
          <tbody id="portfolioTable"></tbody>
        </table>

        <div id="portfolioStats" class="portfolio-stats"></div>
      </section>
    </div>

  </main>
  <footer class="footer"></footer>
</body>
</html>
