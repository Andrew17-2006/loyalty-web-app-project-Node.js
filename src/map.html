<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cashback Invest - Map</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./styles/style.css" />
  <link rel="stylesheet" href="./styles/map.css" />

  <script src="./scripts/header.js"></script>

  <!-- GOOGLE MAPS API -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDUq0nkvWKvX7EWbNrwkRsEvhLp_7qcWeU&libraries=places&callback=initMap" async defer></script>

  <script src="./scripts/map.js" defer></script>

  <link rel="icon" type="image/x-icon" href="./images/web-site_icon.png">
</head>

<body>
  <main class="main-content">

    <div class="map-container">

      <div class="map-controls">
        <h2>Партнерські магазини</h2>

        <div class="search-box">
          <input id="searchInput" type="text" placeholder="Пошук магазину або адреси..." />
          <button id="searchBtn">🔍</button>
        </div>

        <button id="myLocationBtn" class="location-btn">📍 Моє місцезнаходження</button>

        <h3>Мої картки:</h3>
        <div id="storesList" class="stores-list">
          <p class="loading-text">Завантаження...</p>
        </div>
      </div>

      <div id="map" class="map"></div>
    </div>

  </main>

  <footer class="footer"></footer>
</body>
</html>
