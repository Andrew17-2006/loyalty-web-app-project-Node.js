<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cashback Invest – Map</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet" />

  <!-- CSS -->
  <link rel="stylesheet" href="./styles/style.css" />
  <link rel="stylesheet" href="./styles/map.css" />

  <!-- Header auto-load -->
  <script src="./scripts/header.js"></script>

  <!-- Map script (no cache) -->
  <script src="/scripts/map.js?v=5"></script>

  <!-- Google Maps API Loader -->
  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDUq0nkvWKvX7EWbNrwkRsEvhLp_7qcWeU&libraries=places&callback=initMap"
    async defer
  ></script>

  <link rel="icon" type="image/x-icon" href="./images/web-site_icon.png" />
</head>

<body>

  <main class="main-content">

    <div class="map-container">

      <!-- LEFT PANEL -->
      <div class="map-controls">

        <h2>Партнерські магазини</h2>

        <!-- Search -->
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Пошук магазину або адреси..." />
          <button id="searchBtn">🔍</button>
        </div>

        <!-- Location button -->
        <button id="myLocationBtn" class="location-btn">📍 Моє місцезнаходження</button>

        <h3>Мої картки</h3>

        <div id="storesList" class="stores-list">
          <p class="loading-text">Магазини завантажуються...</p>
        </div>

      </div>

      <!-- MAP -->
      <div class="map-wrapper">
        <div id="map"></div>
      </div>

    </div>

  </main>

  <footer class="footer"></footer>

</body>
</html>
